<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventario</title>
<link rel="stylesheet" href="../public/estilos.css">
<style>
body{overflow:auto}
.centro{width:min(860px,100%);display:grid;gap:22px}
.titulo h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.03em}
.titulo p{margin-top:6px;color:var(--texto-3);font-size:14px}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opcion{display:flex;flex-direction:column;gap:10px;text-align:left;padding:24px;background:var(--panel);border:1px solid var(--linea);border-radius:16px;color:var(--texto);transition:border-color .12s,background .12s,transform .12s}
.opcion:hover{border-color:var(--acento);background:var(--panel-2);transform:translateY(-2px)}
.opcion .num{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--acento-suave);color:var(--acento-2);font-weight:700}
.opcion h2{font-size:20px;font-weight:650;letter-spacing:-.01em}
.opcion p{color:var(--texto-2);font-size:14.5px;line-height:1.45}
.opcion small{color:var(--texto-3);font-size:12.5px}
@media (max-width:760px){.opciones{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="pantalla">
  <div class="centro">
    <div class="titulo"><h1>Tipo de equipo</h1><p>Configuración inicial. Puede modificarse después.</p></div>
    <div class="opciones">
      <button class="opcion" data-modo="servidor" type="button">
        <span class="num">1</span>
        <h2>Equipo servidor</h2>
        <p>Aloja la base de datos. Debe permanecer encendido con el programa abierto para que otros equipos se conecten.</p>
        <small>Equipo principal</small>
      </button>
      <button class="opcion" data-modo="cliente" type="button">
        <span class="num">2</span>
        <h2>Equipo secundario</h2>
        <p>Se conecta al equipo servidor por la red local y trabaja sobre la misma base en tiempo real.</p>
        <small>Equipo adicional</small>
      </button>
    </div>
  </div>
</div>
<script src="modo.js"></script>
</body>
</html>
